name: Check Translation Files

on:
  pull_request:
    paths:
      - "app/assets/json/translations/react/*.json"
      - "scripts/check-translation-parity.js"
      - "scripts/known-translation-gaps.json"
      - ".github/workflows/translations-check.yml"

jobs:
  check-sorting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify jq installation
        run: |
          if ! command -v jq &> /dev/null; then
            echo "jq could not be found, installing..."
            sudo apt-get update && sudo apt-get install -y jq
          else
            echo "jq is already installed: $(jq --version)"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16"

      - name: Install dependencies
        run: npm install --global jsonlint-cli

      - name: Validate and check sorting of translation files
        run: |
          for file in app/assets/json/translations/react/*.json; do
            echo "Checking $file"
            jsonlint-cli $file

            jq -S '.' $file > sorted.json
            if ! diff -uw $file sorted.json > differences.txt; then
              echo "Sorting errors found in $file:"
              cat differences.txt
              rm sorted.json differences.txt
              exit 1
            else
              echo "$file is properly sorted."
              rm sorted.json
            fi
          done

  check-key-parity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # loadTranslations() overlays each locale on top of en.json, so a key that is
      # missing from es/tl/zh renders the English string with no error anywhere.
      # This is the only thing in CI that catches that.
      - name: Check translation key parity
        run: node scripts/check-translation-parity.js
